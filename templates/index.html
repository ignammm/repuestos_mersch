{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <title>Inicio</title>
</head>
<body>

    <div class="overlay-container">
        <div class="overlay-dark"></div>

        <div class="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light"></nav>

            <main class="text-center py-5">
                <img src="{% static 'images/Imagen_Respuestos_Mersch-removebg-preview.png' %}" alt="Logo" class="mb-4 logo-img">
            
                <h1 class="mb-4 text-white">Sistema de Gestión - Repuestos Mersch</h1>
            
                <div class="d-flex flex-wrap justify-content-center gap-4">
                    <a href="{% url 'consultar_articulo' %}" class="btn btn-primary btn-lg px-5">
                        <i class="bi bi-box-seam"></i> Stock
                    </a>
                    <a href="{% url 'ingresosRSF' %}" class="btn btn-success btn-lg px-5">
                        <i class="bi bi-plus-circle"></i> Ingreso
                    </a>
                    <a href="{% url 'ventas:carrito_ventas' %}" class="btn btn-danger btn-lg px-5">
                        <i class="bi bi-dash-circle"></i> Egreso
                    </a>
                    <a href="{% url 'ventas:informe_ventas'%}" class="btn btn-secondary btn-lg px-5">
                        <i class="bi bi-graph-up"></i> Reportes
                    </a>
                </div>
            </main>

        </div>
    </div>
    
    <footer>
        {% block footer %}{% endblock %}
    </footer>

</body>
</html>
